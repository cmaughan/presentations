name: Build and Deploy Presentations

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Build all presentations
        run: |
          for dir in */; do
            if [ -f "$dir/_quarto.yml" ] || [ -f "$dir/index.qmd" ]; then
              echo "Building $dir"
              quarto render "$dir"
            fi
          done

      - name: Prepare site
        run: |
          mkdir -p _site
          for dir in */; do
            name="${dir%/}"
            if [ -d "$dir/_output" ]; then
              cp -r "$dir/_output" "_site/$name"
            fi
          done
          # Keep the public landing page curated. Building a new deck must not
          # automatically expose it or replace the card grid with a directory list.
          cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
